name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    # Lint must pass before tests run so code quality failures stop the pipeline early.
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    # Build depends on lint so only clean code reaches the packaging stage.
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  integration-tests:
    runs-on: ubuntu-latest
    # Integration tests need the build output so they can validate the packaged app.
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: app-build
      - run: npm run test:integration

  deploy-staging:
    runs-on: ubuntu-latest
    # Staging should wait for tests so we only promote a verified build.
    needs:
      - unit-tests
      - integration-tests
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - run: echo "Deploying to staging environment"

  deploy-production:
    runs-on: ubuntu-latest
    # Production should only run after staging succeeds so promotion is controlled.
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - run: echo "Deploying to production environment"

  notify:
    runs-on: ubuntu-latest
    # Notify waits for the full pipeline so it can report the final outcome.
    needs:
      - lint
      - unit-tests
      - build
      - integration-tests
      - deploy-staging
      - deploy-production
    if: always()
    timeout-minutes: 5
    steps:
      - run: echo "Pipeline notification sent"
