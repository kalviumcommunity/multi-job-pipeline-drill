name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
        env:
          ESLINT_USE_FLAT_CONFIG: "false"

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Unit-tests run in parallel with build after lint succeeds
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Build runs in parallel with unit-tests after lint succeeds
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Upload artifact dist directory
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Integration tests need the build artifact, so they run after build
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Download artifact dist directory
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist/
      - run: npm run test:integration

  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploy to staging only after both unit-tests and integration-tests succeed
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploying to staging environment"

  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploy to production only after deploy-staging succeeds
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploying to production environment"

  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Notify runs at the very end of all jobs, regardless of success or failure
    needs: [lint, unit-tests, build, integration-tests, deploy-staging, deploy-production]
    if: always()
    steps:
      - run: echo "Pipeline notification sent"
